name: Validate
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [All, Share, Widget, Startup]
        default: All
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Build tests
        run: xcodebuild build-for-testing -project NoProcrastinate.xcodeproj -scheme NoProcrastinate -derivedDataPath Build -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
      - name: Extensions
        run: |
          xcrun simctl install "$DEVICE" Build/Build/Products/Debug-iphonesimulator/NoProcrastinate.app
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Independent startup
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import time
          app = 'Build/Build/Products/Debug-iphonesimulator/NoProcrastinate.app'
          framework = app + '/Frameworks/NoProcrastinateCore.framework/NoProcrastinateCore'
          expected = '@rpath/NoProcrastinateCore.framework/NoProcrastinateCore'
          binary = app + '/NoProcrastinate.debug.dylib'
          if not os.path.exists(binary):
              binary = app + '/NoProcrastinate'
          assert expected in subprocess.check_output(['otool', '-L', binary], text=True)
          assert expected in subprocess.check_output(['otool', '-D', framework], text=True)
          device = os.environ['DEVICE']
          bundle = 'com.drivenligret.NoProcrastinate'
          for attempt in range(2):
              launched = subprocess.check_output(['xcrun', 'simctl', 'launch', device, bundle], text=True)
              pid = launched.strip().split(':')[-1].strip()
              for check in range(5):
                  time.sleep(2)
                  processes = subprocess.check_output(['xcrun', 'simctl', 'spawn', device, 'launchctl', 'list'], text=True)
                  assert any(line.split()[0] == pid and bundle in line for line in processes.splitlines() if line.split())
              subprocess.run(['xcrun', 'simctl', 'terminate', device, bundle], check=True)
          PY
      - name: Test
        run: |
          FILTER=()
          if [[ "${{ inputs.suite }}" == Share ]]; then
            FILTER=(-only-testing:NoProcrastinateUITests/StudyShareUITests)
          elif [[ "${{ inputs.suite }}" == Widget ]]; then
            FILTER=(-only-testing:NoProcrastinateUITests/StudyWidgetUITests)
          elif [[ "${{ inputs.suite }}" == Startup ]]; then
            FILTER=(-only-testing:NoProcrastinateUITests/StudyStartupUITests)
          fi
          xcodebuild test-without-building -project NoProcrastinate.xcodeproj -scheme NoProcrastinate -derivedDataPath Build -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- -resultBundlePath Results.xcresult "${FILTER[@]}"
      - name: Device build
        run: |
          xcodebuild build -project NoProcrastinate.xcodeproj -scheme NoProcrastinate -configuration Release -derivedDataPath DeviceBuild -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          otool -L DeviceBuild/Build/Products/Release-iphoneos/NoProcrastinate.app/NoProcrastinate | grep -F '@rpath/NoProcrastinateCore.framework/NoProcrastinateCore'
      - name: Screenshots
        if: always() && hashFiles('Results.xcresult/Info.plist') != ''
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path Results.xcresult --output-path Screenshots
      - name: Diagnostics
        if: failure()
        run: |
          mkdir -p Diagnostics
          xcrun simctl spawn "$DEVICE" log show --last 10m --style compact --predicate 'process == "NoProcrastinate" OR process == "SpringBoard" OR process == "runningboardd" OR process == "ReportCrash"' > Diagnostics/Simulator.log 2>&1 || true
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          roots = [Path.home() / 'Library/Logs/DiagnosticReports', Path.home() / 'Library/Developer/CoreSimulator/Devices' / os.environ['DEVICE'] / 'data/Library/Logs']
          for root in roots:
              if root.exists():
                  for pattern in ['**/NoProcrastinate*.ips', '**/NoProcrastinate*.crash']:
                      for report in root.glob(pattern):
                          shutil.copy2(report, Path('Diagnostics') / report.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Results-${{ matrix.os }}
          path: |
            Results.xcresult
            Screenshots
            Diagnostics
